spring.application.name=chamados

# H2 em memoria (os dados somem ao reiniciar a aplicacao)
spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza as tabelas automaticamente (apenas para dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
